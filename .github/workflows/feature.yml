name: Feature
on:
  push:
    branches-ignore:
      - main
      - beta
      - alpha
    tags-ignore:
      - "**"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - name: Test
        run: |
          npm install
          npm run build
          npm run lint
          npm run test
